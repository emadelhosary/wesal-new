<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2d"><title>وصال | WESAL</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="logo">و</div><div><h1>وصال</h1><small>تواصل بلا حدود</small></div></header><section id="auth" class="panel"><h2>مرحباً بك في وصال</h2><p>سجّل الدخول أو أنشئ حساباً</p><input id="username" placeholder="اسم المستخدم" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><div class="actions"><button id="login">تسجيل الدخول</button><button id="register" class="secondary">إنشاء حساب</button></div><p id="authMessage"></p></section><section id="messenger" class="messenger hidden"><aside><h2>المحادثات</h2><button id="contactsTab">جهات الاتصال</button><button id="groupsTab">المجموعات</button><button id="logout" class="secondary">خروج</button><p>قائمة المحادثات</p></aside><section class="chat"><div class="chathead"><strong id="chatTitle">اختر محادثة</strong><button id="voiceCall">☎ صوتية</button><button id="videoCall">▣ مرئية</button></div><div id="messages" class="messages"></div><p id="typing"></p><form id="sendForm"><label class="attach">＋<input id="fileInput" type="file" hidden></label><input id="messageInput" placeholder="اكتب رسالتك..."><button>إرسال</button></form><small>يلزم ربط الخادم لتفعيل المراسلة والمكالمات الحقيقية.</small></section></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
